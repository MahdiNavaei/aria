<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">ARIA v0.2 public preview additions</title>
  <desc id="desc">Phase 11 brings vendor automation behind adapter boundaries. Phase 12 publishes replay-safe platform contracts and tests.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="58%" stop-color="#10243a"/>
      <stop offset="100%" stop-color="#0d2f3a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b82c9"/>
      <stop offset="100%" stop-color="#44b3c8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2aa86f"/>
      <stop offset="100%" stop-color="#71d28f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5b84d"/>
      <stop offset="100%" stop-color="#f6d878"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020713" flood-opacity="0.34"/>
    </filter>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#56c7dc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#80dfa0"/>
    </marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .title { font-size: 56px; font-weight: 800; }
      .subtitle { font-size: 23px; font-weight: 500; }
      .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 1.5px; }
      .cardTitle { font-size: 31px; font-weight: 800; }
      .cardText { font-size: 22px; font-weight: 600; }
      .chipText { font-size: 20px; font-weight: 700; }
      .small { font-size: 18px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#canvas)"/>
  <rect width="1400" height="760" fill="url(#grid)"/>

  <g opacity="0.55">
    <circle cx="140" cy="104" r="88" fill="#2b82c9" opacity="0.18"/>
    <circle cx="1245" cy="116" r="112" fill="#2aa86f" opacity="0.16"/>
    <circle cx="1220" cy="652" r="128" fill="#f5b84d" opacity="0.08"/>
  </g>

  <text x="700" y="86" text-anchor="middle" class="font title" fill="#f8fbff">ARIA v0.2 Public Preview</text>
  <text x="700" y="126" text-anchor="middle" class="font subtitle" fill="#c8d7e8">Vendor integrations are constrained by ARIA boundaries; replay contracts become reviewable and testable.</text>

  <g filter="url(#softShadow)">
    <rect x="66" y="188" width="380" height="430" rx="30" fill="#f8fbff"/>
    <rect x="66" y="188" width="380" height="112" rx="30" fill="url(#blue)"/>
    <path d="M66 270H446V300H66Z" fill="url(#blue)"/>
    <text x="104" y="232" class="font eyebrow" fill="#dff6ff">PHASE 11</text>
    <text x="104" y="272" class="font cardTitle" fill="#ffffff">Vendor Boundary</text>

    <g>
      <rect x="104" y="332" width="144" height="48" rx="14" fill="#e5f3fb"/>
      <text x="176" y="363" text-anchor="middle" class="font chipText" fill="#12466d">AIHawk</text>
      <rect x="264" y="332" width="144" height="48" rx="14" fill="#e5f3fb"/>
      <text x="336" y="363" text-anchor="middle" class="font chipText" fill="#12466d">Skyvern</text>
      <rect x="104" y="396" width="144" height="48" rx="14" fill="#e5f3fb"/>
      <text x="176" y="427" text-anchor="middle" class="font chipText" fill="#12466d">OpenAdapt</text>
      <rect x="264" y="396" width="144" height="48" rx="14" fill="#e5f3fb"/>
      <text x="336" y="427" text-anchor="middle" class="font chipText" fill="#12466d">browser-use</text>
    </g>

    <g class="font cardText" fill="#183348">
      <circle cx="110" cy="488" r="7" fill="#2b82c9"/>
      <text x="132" y="496">Adapter-first integration</text>
      <circle cx="110" cy="532" r="7" fill="#2b82c9"/>
      <text x="132" y="540">Safety and HITL stay in charge</text>
      <circle cx="110" cy="576" r="7" fill="#2b82c9"/>
      <text x="132" y="584">License-aware vendor code</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="510" y="238" width="380" height="330" rx="34" fill="#10243a"/>
    <rect x="548" y="278" width="304" height="92" rx="26" fill="#163456" stroke="#3f6688" stroke-width="2"/>
    <text x="700" y="316" text-anchor="middle" class="font eyebrow" fill="#aee7f2">PUBLIC RELEASE</text>
    <text x="700" y="352" text-anchor="middle" class="font cardTitle" fill="#ffffff">Curated v0.2</text>

    <g>
      <path d="M610 428 C640 398 760 398 790 428" fill="none" stroke="#f5d36d" stroke-width="5" stroke-linecap="round" filter="url(#lineGlow)"/>
      <circle cx="610" cy="428" r="10" fill="#f5d36d"/>
      <circle cx="790" cy="428" r="10" fill="#f5d36d"/>
      <circle cx="700" cy="406" r="10" fill="#f5d36d"/>
    </g>

    <g class="font cardText" fill="#e9f4ff">
      <text x="700" y="474" text-anchor="middle">Readable architecture docs</text>
      <text x="700" y="516" text-anchor="middle">Real replay contract slice</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="954" y="188" width="380" height="430" rx="30" fill="#f8fbff"/>
    <rect x="954" y="188" width="380" height="112" rx="30" fill="url(#green)"/>
    <path d="M954 270H1334V300H954Z" fill="url(#green)"/>
    <text x="992" y="232" class="font eyebrow" fill="#edfff3">PHASE 12</text>
    <text x="992" y="272" class="font cardTitle" fill="#ffffff">Platform Contract</text>

    <g class="font chipText" fill="#124535">
      <rect x="992" y="334" width="304" height="54" rx="16" fill="#e5f6ec"/>
      <text x="1144" y="369" text-anchor="middle">TraceEnvelope</text>
      <rect x="992" y="404" width="304" height="54" rx="16" fill="#e5f6ec"/>
      <text x="1144" y="439" text-anchor="middle">StepRecord</text>
      <rect x="992" y="474" width="304" height="54" rx="16" fill="#e5f6ec"/>
      <text x="1144" y="509" text-anchor="middle">ReplayRequest</text>
    </g>

    <g class="font small" fill="#1a4638">
      <path d="M1014 562H1036" stroke="#2aa86f" stroke-width="5" stroke-linecap="round"/>
      <text x="1050" y="568">Deterministic hashes</text>
      <path d="M1014 596H1036" stroke="#2aa86f" stroke-width="5" stroke-linecap="round"/>
      <text x="1050" y="602">Invariant tests</text>
    </g>
  </g>

  <path d="M446 402 C480 402 484 402 510 402" fill="none" stroke="#56c7dc" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)" filter="url(#lineGlow)"/>
  <path d="M890 402 C924 402 928 402 954 402" fill="none" stroke="#80dfa0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowGreen)" filter="url(#lineGlow)"/>

  <g class="font small">
    <rect x="386" y="650" width="628" height="52" rx="26" fill="#f8fbff" opacity="0.92"/>
    <text x="700" y="684" text-anchor="middle" fill="#183348">Private traces, credentials, and run artifacts stay outside the public preview.</text>
  </g>
</svg>
