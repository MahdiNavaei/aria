[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aria"
version = "0.1.0"
description = "Adaptive Reasoning & Intelligent Automation - Personal AI Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "aiosqlite>=0.19.0",

    # Memory
    "mem0ai>=0.1.0",
    "qdrant-client>=1.7.0",

    # Web Crawling
    "crawl4ai>=0.4.0",

    # Browser Automation
    "playwright>=1.40.0",

    # Desktop Automation
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
    "aiofiles>=23.0.0",
    "opencv-python>=4.8.0",  # Image processing (Phase 4 - Eye)

    # RPA Libraries
    "rpaframework>=31.0.0",

    # Protocol
    "mcp>=1.0.0",

    # Events & Data
    "aiokafka>=0.9.0",
    "redis>=5.0.0",

    # LLM
    "ollama>=0.3.0",
    "openai>=1.0.0",
    "transformers>=4.36.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",

    # Voice/Audio
    "librosa>=0.10.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",

    # API
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",

    # UI
    "streamlit>=1.30.0",
    "jdatetime>=4.1.0",  # Persian calendar conversion (Phase 8)
    "persiantools>=3.0.0",  # Persian text processing (Phase 8)

    # Config & Utils
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # Observability
    "structlog>=24.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "responses>=0.24.0",
    "aioresponses>=0.7.6",
    "httpx>=0.26.0",
    "testcontainers>=3.7.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

ui = [
    # Real-time features (optional)
    "streamlit-mic-recorder>=0.0.4",  # Voice input
    "streamlit-autorefresh>=1.0.1",   # Auto-refresh
    # "streamlit-websocket-client",   # WebSocket (check compatibility)
]

voice = [
    # Fast Whisper for STT (alternative to transformers Whisper)
    "faster-whisper>=1.0.0",
]

safety = [
    # Safety & rate limiting
    "limits>=3.0.0",
    "redis-py-cluster>=2.1.0",
    # PII detection
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "scrubadub>=2.0.0",
]

advanced = [
    # Advanced automation (not used in core, for future use)
    "agentql>=1.0.0",      # Agent-based element queries
    "pywinauto>=0.6.8",    # Windows-specific automation
    "gradio>=4.0.0",       # Alternative UI framework
]

memory = [
    # Alternative vector stores (optional)
    "chromadb>=0.4.0",    # Alternative to Qdrant (Phase 2 - optional)
]

[tool.setuptools.packages.find]
where = ["src", "vendor"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["vendor/", "build/", "dist/", ".venv/", "__pycache__/"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "FIX002", # Line contains TODO
    "TD002",  # Missing author in TODO
    "TD003",  # Missing issue link in TODO
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert
    "D",       # docstrings
    "ANN",     # annotations
    "PLR2004", # magic values
    "ARG001",  # unused function argument
    "ARG002",  # unused method argument
    "ARG005",  # unused lambda argument
    "SLF001",  # private member access
    "FBT001",  # boolean positional argument
    "FBT002",  # boolean default positional argument
    "PT012",   # pytest raises with multiple statements
    "ASYNC109", # async function with timeout
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires services)",
    "e2e: End-to-end tests (full system)",
    "slow: Slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
strict = true
