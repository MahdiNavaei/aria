version: '3.8'

services:
  aria-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - ARIA_ENV=production
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    networks:
      - aria-network

  aria-ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run src/aria/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - '8501:8501'
    environment:
      - ARIA_API_URL=http://aria-api:8000
      - ARIA_WS_URL=ws://aria-api:8000/ws
    depends_on:
      - aria-api
    restart: unless-stopped
    networks:
      - aria-network

  aria-learning:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m aria.core.learning.main
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aria-network

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - '9092:9092'
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aria-network

  redis:
    image: redis:7.2-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aria-network

  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6333/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aria-network

networks:
  aria-network:
    driver: bridge

volumes:
  redpanda_data:
  redis_data:
  qdrant_data:
